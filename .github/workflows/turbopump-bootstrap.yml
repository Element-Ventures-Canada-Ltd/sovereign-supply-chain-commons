# Handling: Unclassified — working
#
# Turbopump planning bootstrap. Creates the turbopump labels, milestones, epic and
# sub-task issues from project/turbopump/plan.json. Re-runs are safe: the script
# skips anything that already exists and never overwrites issue text (see
# project/turbopump/bootstrap.mjs).
#
# Runs when the plan or script changes on main, or by hand from the Actions tab.
# It never runs on pull requests, so an unmerged pull request cannot make it
# create issues. Both trigger paths are red zone, so changes need the owner.
name: Turbopump planning bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'project/turbopump/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only: log what would change, create nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: turbopump-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap turbopump plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Dry run (logs the plan before any change)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node project/turbopump/bootstrap.mjs "$GITHUB_REPOSITORY" --dry-run

      - name: Create missing labels, milestones and issues
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node project/turbopump/bootstrap.mjs "$GITHUB_REPOSITORY"
