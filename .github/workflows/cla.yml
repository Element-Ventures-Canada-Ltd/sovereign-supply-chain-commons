# Handling: Unclassified — working
#
# CLA signature workflow (replaces contribution-check.yml; Decision D-021 item 5, D-018 ruling 4).
# Each contributor signs CLA.md ONCE, by posting the sign-off comment on their first pull request.
# The signature is recorded on the `cla-signatures` branch and covers all later contributions.
# No per-commit DCO sign-off is required.
#
# Setup notes for the maintainer:
#   - Leave the `cla-signatures` branch unprotected; the action creates it on first run.
#   - Organizations that have signed the CCLA (CCLA.md) are added to `allowlist` below,
#     alongside their Designated Contributors' logins.
#   - Confirm the pinned release of contributor-assistant/github-action before first use.
#
# AI-authored commits (CONTRIBUTING.md "AI-authored commits"): the `ai-author-gate` job decides,
# per pull request, whether the AI commit identity may be added to `allowlist`. It does so only
# when the PR opener has signed and every AI-authored commit carries a Co-Authored-By trailer.
# It reads the GitHub API only and never checks out or runs pull request code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  ai-author-gate:
    name: AI author gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowlist: ${{ steps.gate.outputs.allowlist }}
    steps:
      # Default ref for these events is the base branch, never the pull request head.
      - name: Checkout base branch
        uses: actions/checkout@v6
      - name: Unit-test the gate
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_ai_author_gate.py'
      - name: Decide allowlist
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          BASE_ALLOWLIST: TLS-sys,dependabot[bot],github-actions[bot]
        run: python3 .github/scripts/ai_author_gate.py

  cla:
    name: CLA signature
    needs: ai-author-gate
    runs-on: ubuntu-24.04
    steps:
      - if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ${{ needs.ai-author-gate.outputs.allowlist }}
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please sign the
            Contributor License Agreement once by posting the comment below. Your signature
            covers this and all later contributions. If your employer may own your work,
            it must sign the Corporate CLA (CCLA.md) first. An AI system cannot sign; the
            Responsible Person named in the PR template signs (CLA.md section 11).
